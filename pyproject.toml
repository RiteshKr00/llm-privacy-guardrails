[project]
name = "llm-privacy-guardrails"
version = "0.1.0"
description = "Agentic privacy layer for LLM pipelines — PII detection, recipient-aware morphing, defensible audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ritesh Kumar" },
]
keywords = ["pii", "privacy", "llm", "agent", "langgraph", "presidio", "dpdp", "gdpr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "pydantic>=2.0",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai"]
openai = ["langchain-openai"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_privacy_guardrails"]
